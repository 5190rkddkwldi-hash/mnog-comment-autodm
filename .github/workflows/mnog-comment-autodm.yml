name: mnog-comment-autodm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'state.json'

permissions:
  contents: write

concurrency:
  group: comment-to-dm
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll loop (about 55 minutes, every 60s)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "mnog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 3300 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            node index.js || true
            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -m "state: $(date -u +%FT%TZ)"
              git pull --rebase --autostash || true
              git push || true
            fi
            sleep 60
          done
